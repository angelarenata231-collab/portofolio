<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="brand brand-admin">
          <span class="brand-mark">A</span>
          <span>Angela</span>
        </div>

        <nav class="admin-menu">
          <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
          <a href="{{ url_for('admin.profile') }}">Profile</a>
          <a href="{{ url_for('admin.skills') }}">Skills</a>
          <a href="{{ url_for('admin.projects') }}">Certified</a>
          <a href="{{ url_for('admin.experiences') }}">Experiences</a>
          <a href="{{ url_for('admin.certificates') }}">Certificates</a>
          <a href="{{ url_for('admin.contacts') }}">Messages</a>
          <a href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
      </aside>

      <main class="admin-main">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-list admin-flash-list">
              {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
